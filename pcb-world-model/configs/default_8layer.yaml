# 8-Layer (2+4+2) HDI PCB Engineering World Model Configuration
# Stackup: F.Cu, In1.GND, In2.SIG1, In3.PWR1, In4.GND2, In5.SIG2, In6.GND3, B.Cu
board_width_mm: 30.0
board_height_mm: 50.0
grid_resolution_mm: 0.1
snap_grid_mm: 0.5
layers: 8
clearance_mm: 0.10
trace_width_mm: 0.10
signal_trace_width_mm: 0.10
power_trace_width_mm: 0.18
via_diameter_mm: 0.50
via_drill_mm: 0.25
microvia_diameter_mm: 0.30
microvia_drill_mm: 0.15
buried_via_diameter_mm: 0.45
buried_via_drill_mm: 0.20
copper_thickness_mm: 0.035
board_thickness_mm: 1.6
prepreg_thickness_mm: 0.10
edge_margin_mm: 1.2

# Rev 12 Sequential Lamination & Staggered Microvia Reliability Rules
hdi_buildup_type: "2+4+2"
max_lamination_cycles: 2
enforce_staggered_microvias: true
microvia_stagger_offset_mm: 0.25

# Neural-Guided Router & Closed-Loop Inference Parameters
alpha_congestion: 2.5
beta_drc_penalty: 1.0
gamma_via_cost: 44.0
gamma_microvia_cost: 3.5
gamma_buried_via_cost: 7.5
enable_internal_planes: true
max_ripup_iterations: 5
num_placement_candidates: 8

# Rev 10 DFM / DFA Craftsmanship Parameters
enable_dfm_craftsmanship: true
corner_fillet_radius_mm: 1.5
screw_stress_buffer_mm: 1.8
preferred_clearance_mm: 0.24
rework_courtyard_margin_mm: 0.8
enable_teardrops: true
enable_test_points: true
